name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        django-version: ["4.2", "5.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          # Tutor plugin lives in a sibling pyproject; install so the
          # tutor-plugin smoke tests can import `tutor` and the plugin.
          python -m pip install -e ./tutor-plugin
          python -m pip install "Django~=${{ matrix.django-version }}.0"

      - name: Migrations check
        run: python -m django makemigrations --check --dry-run --settings=settings --pythonpath=tests

      - name: Test
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .
