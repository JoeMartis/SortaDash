name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        django-version: ["4.2", "5.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          # Tutor plugin lives in a sibling pyproject; install so the
          # tutor-plugin smoke tests can import `tutor` and the plugin.
          python -m pip install -e ./tutor-plugin
          python -m pip install "Django~=${{ matrix.django-version }}.0"

      - name: Migrations check
        run: python -m django makemigrations --check --dry-run --settings=settings --pythonpath=tests

      - name: Test (with coverage)
        run: pytest -v --cov --cov-report=term-missing --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel (main package)
        run: python -m build
      - name: Build sdist + wheel (tutor plugin)
        run: python -m build tutor-plugin
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            tutor-plugin/dist/*

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit runtime dependencies
        # `pip-audit` resolves the project's declared deps and queries
        # the PyPA advisory DB. Fails the job on any unfixed CVE.
        run: pip-audit --strict --disable-pip
