[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-contrib-course-inventory"
version = "0.1.0"
description = "Tutor plugin that installs the course-inventory CMS plugin into Open edX"
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Open edX Community" }]
keywords = ["tutor", "openedx", "plugin", "course-inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = ["tutor>=18.0.0,<22.0.0"]

[project.urls]
Homepage = "https://github.com/openedx/course-inventory"
Source = "https://github.com/openedx/course-inventory"
Issues = "https://github.com/openedx/course-inventory/issues"

[project.entry-points."tutor.plugin.v1"]
course-inventory = "tutorcourseinventory.plugin"

[tool.setuptools.packages.find]
include = ["tutorcourseinventory*"]
