{% extends "course_inventory/base.html" %}
{% load i18n course_inventory %}

{% block ci_content %}
  <div class="ci-layout">
    <aside class="ci-facets" aria-label="{% trans 'Filters' %}">
      {% include "course_inventory/_facet_panel.html" %}
    </aside>
    <section class="ci-main" aria-label="{% trans 'Course inventory results' %}">
      <form method="get" class="ci-searchbar" role="search"
            hx-get="{% url 'course_inventory:inventory' %}"
            hx-target="#inventory-table"
            hx-trigger="submit, keyup changed delay:300ms from:input[name='q']">
        <label class="visually-hidden" for="ci-search">{% trans "Search course display name" %}</label>
        <input id="ci-search" type="search" name="q" value="{{ filters.q }}"
               placeholder="{% trans 'Search course display name…' %}" />
        <button type="submit">{% trans "Search" %}</button>
        <a class="ci-export"
           href="{% url 'course_inventory:export' %}?{% qs_replace format='csv' %}">
          {% trans "Export CSV" %}
        </a>
        <a class="ci-export"
           href="{% url 'course_inventory:export' %}?{% qs_replace format='tsv' %}">
          {% trans "Export TSV" %}
        </a>
        <a class="ci-save"
           href="{% url 'course_inventory:saved_view_create' %}?{{ querystring }}">
          {% trans "Save view" %}
        </a>
      </form>

      <div id="inventory-table">
        {% include "course_inventory/_table.html" %}
      </div>
    </section>
  </div>
{% endblock %}
