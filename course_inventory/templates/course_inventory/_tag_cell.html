{% load course_inventory %}
<div class="ci-tag-cell" id="tags-{{ course_id|slugify }}">
  {% for tag in tags %}
    <span class="ci-chip">
      {{ tag.key }}={{ tag.value }}
      <form method="post"
            action="{% url 'course_inventory:tag_edit' course_id %}"
            hx-post="{% url 'course_inventory:tag_edit' course_id %}"
            hx-target="#tags-{{ course_id|slugify }}"
            hx-swap="outerHTML"
            class="ci-inline">
        {% csrf_token %}
        <input type="hidden" name="action" value="remove" />
        <input type="hidden" name="tag_id" value="{{ tag.pk }}" />
        <button type="submit" title="Remove">x</button>
      </form>
    </span>
  {% endfor %}
  <form method="post"
        action="{% url 'course_inventory:tag_edit' course_id %}"
        hx-post="{% url 'course_inventory:tag_edit' course_id %}"
        hx-target="#tags-{{ course_id|slugify }}"
        hx-swap="outerHTML"
        class="ci-tag-add">
    {% csrf_token %}
    <input type="hidden" name="action" value="add" />
    <input name="key" list="tag-keys" placeholder="key" size="8" required />
    <input name="value" placeholder="value" size="10" required />
    <button type="submit">+</button>
  </form>
</div>
